name: Build SULTAN WALLET APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'wallet_engine.py'
      - 'pyproject.toml'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Build Android APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-number: ${{ github.run_number }}
          extra-args: >-
            --arch arm64-v8a
            --exclude auth_server.py wallet_auth.db auth_secret.key login_patch.py

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SULTAN-WALLET-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
          retention-days: 7
