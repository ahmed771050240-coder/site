name: SULTAN WALLET APK Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Validate Python syntax
        run: python -m compileall -q main.py backend
      - name: Install locked project dependencies
        run: uv sync --group dev
      - name: Build universal Android APK
        run: |
          # Do not pass --arch: Flet's default APK includes all supported Android ABIs.
          uv run flet build apk --yes
          test -n "$(find build -type f -name '*.apk' -print -quit)"
          find build -type f -name "*.apk" -exec ls -lh {} \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SULTAN-WALLET-APK-ALL-ABIS
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
