name: SULTAN WALLET PostgreSQL Tests

on:
  workflow_dispatch:
  push:
    branches:
      - postgres-testing
  pull_request:

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sultan_test
          POSTGRES_PASSWORD: sultan_test_password
          POSTGRES_DB: sultan_wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sultan_test -d sultan_wallet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://sultan_test:sultan_test_password@localhost:5432/sultan_wallet_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-postgres-test.txt

      - name: Compile Python files
        run: |
          python -m py_compile auth_server.py wallet_engine.py test_wallet_postgres.py

      - name: Run PostgreSQL wallet tests
        run: python test_wallet_postgres.py
