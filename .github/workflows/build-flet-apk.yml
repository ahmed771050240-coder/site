name: SULTAN WALLET - Flet APK
# Rebuild after Flet 1.x startup compatibility fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'assets/**'
      - '.github/workflows/build-flet-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build SULTAN WALLET APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Build Android APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}
          extra-args: >-
            --arch arm64-v8a
            --bundle-id org.sultan.wallet
            --product "SULTAN WALLET"
            --project sultan-wallet
            --artifact SULTAN_WALLET

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SULTAN-WALLET-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
