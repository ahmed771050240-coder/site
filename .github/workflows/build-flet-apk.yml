name: SULTAN WALLET - Flet APK
# Build the Android APK with the official Flet builder.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-ui-stability
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'assets/**'
      - 'src/**'
      - '.github/workflows/build-flet-apk.yml'

permissions:
  contents: read

concurrency:
  group: sultan-wallet-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build SULTAN WALLET APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate Python source syntax
        run: python -m py_compile main.py backend/main.py wallet_engine.py auth_server.py

      - name: Build Android APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}
          extra-args: >-
            --arch arm64-v8a
            --bundle-id org.sultan.wallet
            --product "SULTAN WALLET"
            --project sultan-wallet
            --artifact SULTAN_WALLET

      - name: Generate APK checksum
        run: |
          sha256sum "${{ steps.build.outputs.archive-path }}" > "${{ steps.build.outputs.archive-path }}.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SULTAN-WALLET-APK
          path: |
            ${{ steps.build.outputs.archive-path }}
            ${{ steps.build.outputs.archive-path }}.sha256
          archive: false
          if-no-files-found: error
