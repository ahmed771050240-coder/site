name: SULTAN WALLET APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - "assets/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --group dev

      - name: Build SULTAN WALLET APK with Flet
        run: uv run flet build apk --arch arm64-v8a armeabi-v7a

      - name: Verify APK output
        run: |
          find build -type f -name "*.apk" -print
          test -n "$(find build -type f -name "*.apk" -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SULTAN-WALLET-APK
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 7
