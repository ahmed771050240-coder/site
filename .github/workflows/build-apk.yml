name: SULTAN WALLET APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"
          test -d "$ANDROID_HOME/platforms/android-33"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36

      - name: Configure Buildozer SDK
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path

          p = Path("buildozer.spec")
          lines = p.read_text().splitlines()

          start = lines.index("[app]")
          end = next(
              (i for i in range(start + 1, len(lines))
               if lines[i].startswith("[") and lines[i].endswith("]")),
              len(lines)
          )

          keys = (
              "android.sdk_path",
              "android.accept_sdk_license",
              "android.skip_update",
              "android.api",
              "android.minapi",
              "android.build_tools",
          )

          section = [
              line for line in lines[start + 1:end]
              if not any(line.strip().startswith(k + " =") for k in keys)
          ]

          settings = [
              f"android.sdk_path = {os.environ['ANDROID_HOME']}",
              "android.accept_sdk_license = True",
              "android.skip_update = True",
              "android.api = 33",
              "android.minapi = 21",
              "android.build_tools = 33.0.2",
          ]

          lines = lines[:start + 1] + settings + section + lines[end:]
          p.write_text("\n".join(lines) + "\n")
          print("Buildozer Android SDK configured successfully.")
          PYTHON

      - name: Build SULTAN WALLET APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SULTAN-WALLET-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7