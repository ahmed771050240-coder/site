services:
  - type: web
    name: sultan-wallet-api
    runtime: python
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
