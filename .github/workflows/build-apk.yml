name: SULTAN WALLET APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --group dev

      - name: Validate source files
        run: |
          test -f main.py
          test -f pyproject.toml
          uv run python -m compileall -q main.py auth_server.py wallet_engine.py

      - name: Build Android APK
        run: uv run flet build apk --arch arm64-v8a

      - name: Verify APK output
        run: |
          find build -type f -name "*.apk" -print -quit | grep -q .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SULTAN-WALLET-APK
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
