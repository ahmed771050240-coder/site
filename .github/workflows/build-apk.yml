name: SULTAN WALLET APK Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Validate Python syntax and Flet entry point
        run: |
          python -m compileall -q main.py
          if grep -nE 'ft\.run\s*\(\s*target\s*=' main.py; then
            echo "ERROR: Flet 1.0 entry point must use ft.run(main), not target="
            exit 1
          fi
          grep -nE '^ft\.run\(main\)' main.py
      - name: Build APK
        run: |
          ls -la
          uv sync --group dev || uv sync
          uv run flet build apk --arch arm64-v8a || flet build apk
          find build -type f -name "*.apk" -print
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SULTAN-WALLET-APK
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
