name: Build SULTAN WALLET APK

on:
  push:
    branches: [main, fix-build-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-33
            build-tools;33.0.2

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

          find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            ! -name "33.0.2" -exec rm -rf {} +

          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"
          test -d "$ANDROID_HOME/platforms/android-33"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36

      - name: Configure Buildozer SDK
        run: |
          sed -i '/^android.sdk_path[[:space:]]*=/d' buildozer.spec
          echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SULTAN-WALLET-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
